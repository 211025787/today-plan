="#4772FA">下周计划表 ↗</text><rect x="42" y="268" width="276" height="128" rx="12" fill="#E9EBF7"/><circle cx="180" cy="326" r="20" fill="#9B8CFF" fill-opacity="0.35"/><path d="M165 335 l 11 -13 l 9 10 l 7 -7 l 11 14 z" fill="#FFFFFF"/><text x="180" y="382" font-size="8.5" fill="#8A8FA3" text-anchor="middle">Markdown 在线图片 / 本地图片</text><rect x="42" y="408" width="276" height="42" rx="12" fill="#F1F2F9"/><text x="58" y="434" font-size="10" fill="#1B1B2F">视频 · 本周专注记录</text><text x="298" y="434" font-size="9" fill="#4772FA" text-anchor="end">点击播放 ›</text><text x="42" y="484" font-size="13" font-weight="600" fill="#1B1B2F">下周重点</text><text x="42" y="506" font-size="10" fill="#1B1B2F">把深度工作放在上午，下午安排运动与复盘；</text><text x="42" y="524" font-size="10" fill="#1B1B2F">健身改为隔天一次，降低中断概率。</text><text x="42" y="552" font-size="8.5" fill="#8A8FA3">支持加粗、斜体、列表、引用、链接与图片</text><text x="60" y="620" font-size="11" fill="#D64545">删除</text><text x="300" y="620" font-size="11" fill="#4772FA" text-anchor="end">关闭</text></svg>